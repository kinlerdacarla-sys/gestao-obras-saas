name: Core SaaS CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: obras
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: obras_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U obras -d obras_test" --health-interval 5s --health-retries 15
      redis:
        image: redis:8.2
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 15
    env:
      NODE_ENV: test
      MAIL_TRANSPORT: stream
      DATABASE_URL: postgresql://obras:ci-only@localhost:5432/obras_test
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
      DEMO_PASSWORD: Demo-Obras!2026
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate ephemeral signing key
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run generate
      - run: npm run migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --profile validation config --quiet
      - name: Build and start clean application stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check application and migrations
        run: |
          docker compose ps
          curl --fail http://localhost:3001/health
          docker compose exec -T api npx prisma migrate status
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose-ci.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-ci.log
      - name: Remove isolated CI stack
        if: always()
        run: docker compose --profile validation down -v
