name: Core SaaS CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: obras
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: obras_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U obras -d obras_test" --health-interval 5s --health-retries 15
      redis:
        image: redis:8.2
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 15
    env:
      NODE_ENV: test
      MAIL_TRANSPORT: stream
      DATABASE_URL: postgresql://obras:ci-only@localhost:5432/obras_test
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
      DEMO_PASSWORD: Demo-Obras!2026
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate ephemeral signing key
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run generate
      - run: npm run migrate
      - run: npx prisma migrate status
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --profile validation config --quiet
      - name: Build and start clean application stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check application and migrations
        run: |
          docker compose ps
          curl --fail http://localhost:3001/health
          docker compose exec -T api npx prisma migrate status
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose-ci.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-ci.log
      - name: Remove isolated CI stack
        if: always()
        run: docker compose --profile validation down -v

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable non-root runtime images
        run: |
          docker build --target production-api -t obras-api:${{ github.sha }} -f infrastructure/docker/Dockerfile .
          docker build --target production-worker -t obras-worker:${{ github.sha }} -f infrastructure/docker/Dockerfile .
          docker build --target production-web -t obras-web:${{ github.sha }} -f infrastructure/docker/Dockerfile .
          test "$(docker inspect -f '{{.Config.User}}' obras-api:${{ github.sha }})" = node
          test "$(docker inspect -f '{{.Config.User}}' obras-worker:${{ github.sha }})" = node
          test "$(docker inspect -f '{{.Config.User}}' obras-web:${{ github.sha }})" = node
          docker run --rm obras-api:${{ github.sha }} node -e "if(require('fs').existsSync('/app/node_modules/typescript')) process.exit(1)"

      - name: Scan production runtimes for critical vulnerabilities
        run: |
          for name in api web worker; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-data:/root/.cache/trivy aquasec/trivy:0.76.2 image --scanners vuln --severity CRITICAL --exit-code 1 --no-progress "obras-$name:${{ github.sha }}"
          done

  launch-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.17.1" }
      - name: Verify rollback and gate logic without AWS
        run: python -m unittest discover -s tests/release -v
      - name: Offline Terraform validation (no AWS identity or remote backend)
        run: |
          terraform fmt -recursive -check infrastructure
          for root in infrastructure/bootstrap infrastructure/environments/staging infrastructure/environments/production; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Scan Git history without printing secrets
        run: docker run --rm -w /repo -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: S3-compatible persistence and signing checks (local credentials only)
        env:
          AWS_ACCESS_KEY_ID: local-validation
          AWS_SECRET_ACCESS_KEY: isolated-storage-validation
        run: |
          docker compose -f infrastructure/docker/compose.s3-test.yml up -d --wait
          npx vitest run tests/storage
      - if: always()
        run: docker compose -f infrastructure/docker/compose.s3-test.yml down
